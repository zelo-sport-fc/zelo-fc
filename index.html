<!DOCTYPE html>
<html lang="ar" dir="rtl" id="app-html">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#121215">
    <title>ZELO FC App</title>

    <!-- 🛠️ [خيارات المطور 1/3]: أدوات التصحيح (Eruda Mobile DevTools) -->
    <script src="https://cdn.jsdelivr.net/npm/eruda"></script>
    <script>
        // تفعيل كونسول المطور فوراً
        eruda.init();
        console.log("🚀 [DevMode] Eruda Console Initialized Successfully.");
    </script>

    <!-- 🛠️ [خيارات المطور 2/3]: لالتقاط جميع الأخطاء البرمجية وحظر الملفات -->
    <script>
        window.onerror = function(msg, url, lineNo, columnNo, error) {
            console.error("❌ [Global Error]:", { msg, url, lineNo, columnNo, error });
            return false;
        };

        window.addEventListener('unhandledrejection', function(event) {
            console.error("❌ [Unhandled Promise Rejection]:", event.reason);
        });
    </script>
    
    <!-- Telegram WebApp SDK -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>

    <!-- Web3 & Crypto SDKs -->
    <script src="https://unpkg.com/@solana/web3.js@1.98.0/lib/index.iife.min.js"></script>
    <script src="https://unpkg.com/@tonconnect/ui@2.0.9/dist/tonconnect-ui.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.48.1/dist/umd/supabase.js"></script>
    
    <style>
        :root {
            --bg-dark: #121215;        
            --bg-card: rgba(28, 28, 34, 0.7); 
            --text-main: #f8fafc;      
            --text-muted: #888899;     
            --accent-purple: #833ab4;
            --accent-red: #fd1d1d;
            --accent-gold: #fcb045;
            --accent-green: #14F195;
            --glass-border: rgba(255, 255, 255, 0.08);
        }

        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', system-ui, -apple-system, Roboto, sans-serif;
            background-color: var(--bg-dark);
            color: var(--text-main);
            user-select: none; 
            -webkit-user-select: none;
            overflow-x: hidden;
            min-height: 100vh;
        }

        ::-webkit-scrollbar { display: none; }

        .container {
            margin-top: 80px; 
            margin-bottom: 95px;
            padding: 12px;
            min-height: calc(100vh - 175px);
            animation: fadeUp 0.4s ease-out forwards; 
        }

        /* Header Bar */
        .top-bar {
            position: fixed;
            top: 10px;
            left: 10px;
            right: 10px;
            height: 58px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(18, 18, 22, 0.85);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            padding: 0 16px;
            border-radius: 16px;
            border: 1px solid rgba(252, 176, 69, 0.25); 
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.5);
            z-index: 1000;
        }

        /* Bottom Navigation Bar */
        .bottom-nav {
            position: fixed;
            bottom: 12px;
            left: 2%;
            right: 2%;
            width: 96%;
            height: 65px;
            background: rgba(18, 18, 22, 0.9);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-radius: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 6px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.9), 0 0 15px rgba(131, 58, 180, 0.15);
            border: 1px solid rgba(255, 255, 255, 0.08);
            z-index: 1000;
        }

        .nav-item {
            background: none;
            border: none;
            outline: none;
            padding: 2px 0;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            flex: 1;
            max-width: 60px;
            height: 52px;
            border-radius: 12px;
            color: var(--text-muted);
            transition: all 0.25s ease;
        }

        .icon-wrapper {
            font-size: 1.2rem;
            margin-bottom: 2px;
            transition: all 0.25s ease;
            filter: grayscale(100%) opacity(0.6); 
        }

        .nav-text {
            font-size: 0.6rem;
            font-weight: 700;
            transition: color 0.25s ease;
            white-space: nowrap;
        }

        .nav-item.active {
            background: linear-gradient(135deg, rgba(131, 58, 180, 0.2), rgba(253, 29, 29, 0.2));
            border: 1px solid rgba(253, 29, 29, 0.35);
            box-shadow: inset 0 0 8px rgba(252, 176, 69, 0.25);
        }

        .nav-item.active .icon-wrapper {
            filter: grayscale(0%) opacity(1);
            transform: scale(1.1);
            animation: pulseGlowIcon 2s infinite alternate;
        }

        .nav-item.active .nav-text {
            color: var(--accent-gold);
            text-shadow: 0 0 5px rgba(253, 29, 29, 0.5);
        }

        .card {
            background: var(--bg-card);
            backdrop-filter: blur(10px);
            padding: 16px;
            border-radius: 18px;
            margin-bottom: 14px;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.4);
            border: 1px solid var(--glass-border);
            position: relative;
            overflow: hidden;
            transition: transform 0.2s ease, border-color 0.2s ease;
        }

        .btn-action {
            position: relative;
            width: 100%;
            background: linear-gradient(270deg, var(--accent-purple), var(--accent-red), var(--accent-gold), var(--accent-red), var(--accent-purple));
            background-size: 400% 400%;
            animation: gradientMove 3s ease infinite, pulseShadow 2s infinite alternate;
            color: #fff;
            border: none;
            padding: 14px;
            border-radius: 12px;
            font-weight: 900; 
            font-size: 1rem;
            cursor: pointer;
            margin-top: 10px;
            transition: transform 0.2s;
            text-shadow: 0 2px 4px rgba(0,0,0,0.3);
            overflow: hidden;
            z-index: 1;
        }

        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(15px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes gradientMove {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        @keyframes pulseShadow {
            0% { box-shadow: 0 0 10px rgba(253, 29, 29, 0.4); }
            100% { box-shadow: 0 0 22px rgba(252, 176, 69, 0.6); }
        }

        @keyframes pulseGlowIcon {
            0% { filter: drop-shadow(0 0 3px var(--accent-purple)); }
            100% { filter: drop-shadow(0 0 10px var(--accent-gold)); }
        }
    </style>
</head>
<body>

    <!-- Header / Top Bar -->
    <header class="top-bar" id="top-bar">
        <div id="club" style="font-size: 0.9rem; color: #e0e0e0; font-weight: bold; cursor: pointer;" onclick="window.checkAppDiagnostics()">⚡ ZELO FC <span style="font-size: 0.65rem; color: #fcb045;">(🔍 فحص)</span></div>
        <div id="points" style="font-weight: bold; color: var(--accent-gold); background: rgba(252, 176, 69, 0.15); padding: 5px 12px; border-radius: 10px; border: 1px solid rgba(252, 176, 69, 0.3);">
            0 🪙
        </div>
    </header>

    <!-- Main Dynamic Content Container -->
    <main class="container" id="main-content"></main>

    <!-- Bottom Navigation Bar -->
    <nav class="bottom-nav" id="bottom-nav">
        <button class="nav-item active" onclick="showPage('home')">
            <span class="icon icon-wrapper">🏠</span>
            <span class="nav-text">الرئيسية</span>
        </button>
        <button class="nav-item" onclick="showPage('tasks')">
            <span class="icon icon-wrapper">🛠</span>
            <span class="nav-text">المهام</span>
        </button>
        <button class="nav-item" onclick="showPage('friends')">
            <span class="icon icon-wrapper">👥</span>
            <span class="nav-text">الأصدقاء</span>
        </button>
        <button class="nav-item" onclick="showPage('leaderboard')">
            <span class="icon icon-wrapper">🏆</span>
            <span class="nav-text">الترتيب</span>
        </button>
        <button class="nav-item" onclick="showPage('wallet')">
            <span class="icon icon-wrapper">👛</span>
            <span class="nav-text">المحفظة</span>
        </button>
        <button class="nav-item" onclick="showPage('meteora')">
            <span class="icon icon-wrapper">☄️</span>
            <span class="nav-text">Meteora</span>
        </button>
    </nav>

    <!-- Data & Application Logic Scripts (الإصدار المحدث v=2002) -->
    <script src="clubsData.js?v=2002"></script>
    <script src="data.js?v=2002"></script> 
    <script src="countries.js?v=2002"></script>
    <script src="i18n-helpers.js?v=2002"></script>
    <script src="ranking.js?v=2002"></script>
    
    <script src="login.js?v=2002"></script>
    <script src="weekly_match_rankings.js?v=2002"></script>
    <script src="predictions_ranking.js?v=2002"></script> 

    <!-- Trading & Matches Module Script -->
    <script src="matchesTrade.js?v=2296"></script>

    <!-- UI Pages Scripts -->
    <script src="home.js?v=2002"></script>
    <script src="tasks.js?v=2002"></script>
    <script src="leaderboard.js?v=2002"></script>
    <script src="friends.js?v=2002"></script>
    
    <!-- Wallet Integration Scripts -->
    <script src="wallet-ton.js?v=2002"></script>
    <script src="wallet-solana.js?v=2002"></script>
    
    <!-- Main App Router & Handler -->
    <script src="app.js?v=2022"></script>

    <!-- 🛠 [خيارات المطور 3/3]: دالة الفحص السريع للنظام -->
    <script>
        window.checkAppDiagnostics = function() {
            const report = {
                "Telegram WebApp": typeof window.Telegram !== "undefined" && !!window.Telegram.WebApp,
                "renderMeteoraPage": typeof window.renderMeteoraPage === "function",
                "executeDevnetSwap": typeof window.executeDevnetSwap === "function",
                "openSwapModal": typeof window.openSwapModal === "function",
                "Solana Web3 Library": typeof window.solanaWeb3 !== "undefined",
                "Supabase Client": typeof window.supabaseClient !== "undefined" && !!window.supabaseClient
            };

            console.table(report);
            alert("📋 نتائج الفحص الشامل:\n\n" + JSON.stringify(report, null, 2));
        };
    </script>

</body>
</html>
